services:
  - type: web
    name: nostalix-ai-backend
    env: python
    buildCommand: |
      pip install --upgrade pip setuptools wheel &&
      pip install -r requirements.txt &&
      pip install -e basicsr_repo &&
      chmod +x install_realesrgan.sh 2>/dev/null || true &&
      sh install_realesrgan.sh &&
      echo "=== Build terminé ==="
    startCommand: python app.py
    envVars:
      - key: FLASK_ENV
        value: production
      - key: PORT
        value: 5000
    plan: free
