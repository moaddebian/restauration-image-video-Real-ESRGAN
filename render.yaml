services:
  - type: web
    name: nostalix-ai-backend
    env: python
    buildCommand: |
      pip install -r requirements.txt &&
      pip install -e basicsr_repo &&
      pip install git+https://github.com/xinntao/Real-ESRGAN.git
    startCommand: python app.py
    envVars:
      - key: FLASK_ENV
        value: production
      - key: PORT
        value: 5000
    plan: free
